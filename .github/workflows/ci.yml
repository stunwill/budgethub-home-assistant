name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: budgethub/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r budgethub/backend/requirements.txt
          pip install ruff

      - name: Compile Python sources
        run: python -m compileall budgethub/backend/app

      - name: Ruff lint
        run: ruff check budgethub/backend/app

      - name: Import application
        run: PYTHONPATH=budgethub/backend python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: budgethub/frontend
        run: npm install

      - name: Build frontend
        working-directory: budgethub/frontend
        run: npm run build

  addon:
    name: Home Assistant app checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository and app YAML
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path("repository.yaml"),
              Path("budgethub/config.yaml"),
              Path("budgethub/build.yaml"),
          ):
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Validated {path}")
          PY

      - name: Validate required app metadata
        run: |
          python - <<'PY'
          import yaml

          with open("budgethub/config.yaml", "r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)

          required = ["name", "version", "slug", "description", "arch", "startup", "boot"]
          missing = [key for key in required if key not in config]
          if missing:
              raise SystemExit(f"Missing required config.yaml keys: {', '.join(missing)}")

          if config.get("slug") != "budgethub":
              raise SystemExit("budgethub/config.yaml slug must be 'budgethub'")

          print("Home Assistant app metadata looks valid")
          PY

      - name: Build Docker image
        working-directory: budgethub
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20 -t budgethub-ci .
